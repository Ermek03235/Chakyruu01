<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бакыт & Арууке — Той Чакыруу</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: #f5f0e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  /* Панель управления */
  .control-panel {
    background: white;
    border-radius: 16px;
    padding: 20px 30px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
    justify-content: center;
    max-width: 900px;
    width: 100%;
  }

  .control-panel label {
    font-size: 14px;
    font-weight: 600;
    color: #5a4a3a;
  }

  .control-panel input[type="text"] {
    padding: 10px 16px;
    border: 2px solid #d4c5a9;
    border-radius: 8px;
    font-size: 16px;
    font-family: 'Cormorant Garamond', serif;
    width: 200px;
    outline: none;
    transition: border-color 0.3s;
  }

  .control-panel input[type="text"]:focus {
    border-color: #b8960c;
  }

  .control-panel button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Cormorant Garamond', serif;
  }

  .btn-apply {
    background: #b8960c;
    color: white;
  }

  .btn-apply:hover {
    background: #9a7d0a;
    transform: translateY(-2px);
  }

  .btn-save {
    background: #2c5f2d;
    color: white;
  }

  .btn-save:hover {
    background: #1e4420;
    transform: translateY(-2px);
  }

  .btn-edit {
    background: #6b4c3b;
    color: white;
  }

  .btn-edit:hover {
    background: #4a3428;
    transform: translateY(-2px);
  }

  /* Само приглашение */
  .invitation-wrapper {
    position: relative;
    width: 600px;
    max-width: 100%;
  }

  .invitation {
    position: relative;
    width: 100%;
    min-height: 1000px;
    background: linear-gradient(180deg, 
      #e8dcc8 0%, 
      #f0e6d2 15%,
      #f5edd8 30%,
      #f8f2e4 50%,
      #f0e6d2 70%,
      #d4c5a9 100%
    );
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  /* Горный фон — СВЕРХУ как шапка */
  .mountain-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 42%;
    background: url('mountains-top.jpg') center/cover no-repeat;
    opacity: 0.9;
    filter: saturate(1.15) contrast(1.05);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.95) 30%, rgba(0,0,0,0.7) 55%, rgba(0,0,0,0.3) 75%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.95) 30%, rgba(0,0,0,0.7) 55%, rgba(0,0,0,0.3) 75%, rgba(0,0,0,0) 100%);
  }

  /* Орнаментальная рамка */
  .ornament-border {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
  }

  .ornament-border svg {
    width: 100%;
    height: 100%;
  }

  /* Контент */
  .content {
    position: relative;
    z-index: 5;
    padding: 200px 50px 40px;
    text-align: center;
    min-height: 1000px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Редактируемые поля */
  .editable {
    outline: none;
    cursor: text;
    transition: background 0.3s;
    border-radius: 4px;
    padding: 2px 6px;
    margin: 0 -6px;
  }

  .editable:hover {
    background: rgba(184, 150, 12, 0.1);
  }

  .editable:focus {
    background: rgba(184, 150, 12, 0.15);
    box-shadow: 0 0 0 2px rgba(184, 150, 12, 0.3);
  }

  .guest-name {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 46px;
    color: #3a2a1a;
    margin-bottom: 5px;
    line-height: 1.2;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #5a4a3a;
    margin-bottom: 20px;
  }

  .couple-names {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 52px;
    color: #2a1a0a;
    line-height: 1.3;
    margin-bottom: 5px;
  }

  .ampersand {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 36px;
    color: #b8960c;
    margin: 0;
    line-height: 1;
  }

  .invitation-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 24px;
    font-weight: 500;
    color: #4a3a2a;
    line-height: 1.7;
    margin: 20px 0 30px;
    max-width: 480px;
  }

  /* Дата и время */
  .date-section {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 20px 0;
  }

  .date-item {
    text-align: center;
  }

  .date-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8a7a6a;
    margin-bottom: 5px;
  }

  .date-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    color: #2a1a0a;
    font-weight: 600;
  }

  .date-circle {
    width: 100px;
    height: 100px;
    border: 2px solid #b8960c;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.7);
    gap: 2px;
  }

  .date-circle .day {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 600;
    color: #2a1a0a;
    line-height: 1;
  }

  .date-circle .month {
    font-size: 10px;
    letter-spacing: 1px;
    color: #5a4a3a;
    text-transform: uppercase;
  }

  .date-circle .weekday {
    font-size: 9px;
    color: #8a7a6a;
  }

  .divider-line {
    width: 60px;
    height: 1px;
    background: #b8960c;
  }

  /* Место проведения */
  .venue {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 700;
    color: #3a2a1a;
    font-style: italic;
    margin: 15px 0 5px;
  }

  .venue-city {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #5a4a3a;
    margin-bottom: 20px;
  }

  /* Кнопка карты */
  .map-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #2a1a0a;
    color: white;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    margin: 10px 0 25px;
    transition: all 0.3s;
  }

  .map-btn:hover {
    background: #b8960c;
    transform: translateY(-2px);
  }

  .map-btn::before {
    content: '📍';
    font-size: 14px;
  }

  /* Хозяева */
  .hosts-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #5a4a3a;
    margin-bottom: 8px;
  }

  .hosts-names {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 38px;
    color: #3a2a1a;
  }

  /* Декоративные элементы */
  .ornament-top, .ornament-bottom {
    text-align: center;
    color: #b8960c;
    font-size: 24px;
    margin: 10px 0;
  }

  /* Режим редактирования */
  .editing .editable {
    border: 2px dashed #b8960c;
    background: rgba(255,255,255,0.3);
  }

  /* Адаптивность */
  @media (max-width: 640px) {
    .invitation { min-height: 850px; }
    .content { padding: 150px 25px 30px; }
    .guest-name { font-size: 38px; }
    .couple-names { font-size: 40px; }
    .invitation-text { font-size: 17px; }
    .date-circle { width: 80px; height: 80px; }
    .date-circle .day { font-size: 22px; }
    .control-panel { padding: 15px; }
  }

  /* Уведомление */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #2c5f2d;
    color: white;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.4s;
    z-index: 1000;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- Панель управления -->
<div class="control-panel">
  <label for="guestInput">👤 Коноктун аты:</label>
  <input type="text" id="guestInput" value="" placeholder="Аты-жөнүн жазыңыз">
  <button class="btn-apply" onclick="applyGuestName()">✅ Колдонуу</button>
  <button class="btn-save" onclick="saveAsImage()">📥 Сүрөт жүктөө</button>
  <button class="btn-edit" onclick="saveAsHTML()">📄 Файл жүктөө</button>
</div>

<!-- Приглашение -->
<div class="invitation-wrapper">
  <div class="invitation" id="invitation">
    
    <!-- Горный фон -->
    <div class="mountain-bg"></div>

    <!-- Орнаментальная рамка SVG -->
    <div class="ornament-border">
      <svg viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <!-- Внешняя рамка -->
        <rect x="15" y="15" width="570" height="970" fill="none" stroke="#b8960c" stroke-width="1.5" opacity="0.6"/>
        <rect x="25" y="25" width="550" height="950" fill="none" stroke="#b8960c" stroke-width="0.8" opacity="0.4"/>
        
        <!-- Угловые орнаменты -->
        <!-- Верхний левый -->
        <g transform="translate(15,15)">
          <path d="M0,40 Q0,0 40,0" fill="none" stroke="#b8960c" stroke-width="2"/>
          <path d="M0,30 Q0,0 30,0" fill="none" stroke="#b8960c" stroke-width="1"/>
          <circle cx="8" cy="8" r="3" fill="#b8960c" opacity="0.6"/>
          <path d="M5,20 Q5,5 20,5" fill="none" stroke="#b8960c" stroke-width="0.8"/>
          <path d="M10,15 L15,10 L20,15 L15,20 Z" fill="#b8960c" opacity="0.3"/>
        </g>
        <!-- Верхний правый -->
        <g transform="translate(585,15) scale(-1,1)">
          <path d="M0,40 Q0,0 40,0" fill="none" stroke="#b8960c" stroke-width="2"/>
          <path d="M0,30 Q0,0 30,0" fill="none" stroke="#b8960c" stroke-width="1"/>
          <circle cx="8" cy="8" r="3" fill="#b8960c" opacity="0.6"/>
          <path d="M5,20 Q5,5 20,5" fill="none" stroke="#b8960c" stroke-width="0.8"/>
          <path d="M10,15 L15,10 L20,15 L15,20 Z" fill="#b8960c" opacity="0.3"/>
        </g>
        <!-- Нижний левый -->
        <g transform="translate(15,985) scale(1,-1)">
          <path d="M0,40 Q0,0 40,0" fill="none" stroke="#b8960c" stroke-width="2"/>
          <path d="M0,30 Q0,0 30,0" fill="none" stroke="#b8960c" stroke-width="1"/>
          <circle cx="8" cy="8" r="3" fill="#b8960c" opacity="0.6"/>
          <path d="M5,20 Q5,5 20,5" fill="none" stroke="#b8960c" stroke-width="0.8"/>
          <path d="M10,15 L15,10 L20,15 L15,20 Z" fill="#b8960c" opacity="0.3"/>
        </g>
        <!-- Нижний правый -->
        <g transform="translate(585,985) scale(-1,-1)">
          <path d="M0,40 Q0,0 40,0" fill="none" stroke="#b8960c" stroke-width="2"/>
          <path d="M0,30 Q0,0 30,0" fill="none" stroke="#b8960c" stroke-width="1"/>
          <circle cx="8" cy="8" r="3" fill="#b8960c" opacity="0.6"/>
          <path d="M5,20 Q5,5 20,5" fill="none" stroke="#b8960c" stroke-width="0.8"/>
          <path d="M10,15 L15,10 L20,15 L15,20 Z" fill="#b8960c" opacity="0.3"/>
        </g>

        <!-- Декоративные элементы по бокам -->
        <g opacity="0.4">
          <path d="M30,250 Q20,260 30,270 Q40,260 30,250" fill="#b8960c"/>
          <path d="M30,500 Q20,510 30,520 Q40,510 30,500" fill="#b8960c"/>
          <path d="M30,750 Q20,760 30,770 Q40,760 30,750" fill="#b8960c"/>
          <path d="M570,250 Q560,260 570,270 Q580,260 570,250" fill="#b8960c"/>
          <path d="M570,500 Q560,510 570,520 Q580,510 570,500" fill="#b8960c"/>
          <path d="M570,750 Q560,760 570,770 Q580,760 570,750" fill="#b8960c"/>
        </g>

        <!-- Верхний центральный орнамент (ромб с линиями) -->
        <g transform="translate(300, 45)">
          <line x1="-60" y1="0" x2="-12" y2="0" stroke="#b8960c" stroke-width="0.8" opacity="0.5"/>
          <line x1="12" y1="0" x2="60" y2="0" stroke="#b8960c" stroke-width="0.8" opacity="0.5"/>
          <path d="M0 -8 L8 0 L0 8 L-8 0 Z" fill="none" stroke="#b8960c" stroke-width="1.2" opacity="0.7"/>
          <path d="M0 -4 L4 0 L0 4 L-4 0 Z" fill="#b8960c" opacity="0.5"/>
        </g>

        <!-- Нижний центральный орнамент (ромб с линиями) -->
        <g transform="translate(300, 955)">
          <line x1="-60" y1="0" x2="-12" y2="0" stroke="#b8960c" stroke-width="0.8" opacity="0.5"/>
          <line x1="12" y1="0" x2="60" y2="0" stroke="#b8960c" stroke-width="0.8" opacity="0.5"/>
          <path d="M0 -8 L8 0 L0 8 L-8 0 Z" fill="none" stroke="#b8960c" stroke-width="1.2" opacity="0.7"/>
          <path d="M0 -4 L4 0 L0 4 L-4 0 Z" fill="#b8960c" opacity="0.5"/>
        </g>
      </svg>
    </div>

    <!-- Контент -->
    <div class="content">
      
      <div class="ornament-top">✦</div>

      <!-- Имя гостя (ЕДИНСТВЕННОЕ редактируемое поле) -->
      <div class="guest-name editable" contenteditable="true" id="guestName">Урматтуу</div>

      <div class="subtitle">Сиздерди балдарыбыз</div>

      <!-- Имена пары -->
      <div class="couple-names">Бакыт</div>
      <div class="ampersand">&amp;</div>
      <div class="couple-names">Аруукенин</div>

      <!-- Текст приглашения -->
      <div class="invitation-text">
        үйлөнүү үлпөт тоюна келип,<br>
        кадырлуу коногубуз болууга<br>
        чакырабыз!
      </div>

      <!-- Дата -->
      <div class="date-section">
        <div class="date-item">
          <div class="date-label">Жыл</div>
          <div class="date-value">2026</div>
        </div>
        
        <div class="divider-line"></div>
        
        <div class="date-circle">
          <div class="day">27</div>
          <div class="month">Сентябрь</div>
          <div class="weekday">(Жекшемби)</div>
        </div>
        
        <div class="divider-line"></div>
        
        <div class="date-item">
          <div class="date-label">Убакыт</div>
          <div class="date-value">16:00</div>
        </div>
      </div>

      <!-- Место -->
      <div class="venue">«Касиет Грант» рестораны</div>
      <div class="venue-city">Ош шаары</div>

      <!-- Кнопка карты -->
      <a href="https://www.google.com/maps/search/?api=1&query=Kasiet+Grand+Osh" class="map-btn" target="_blank">
        Картадан көрүү
      </a>

      <!-- Хозяева -->
      <div class="hosts-label">Той ээлери</div>
      <div class="hosts-names">Алым, Гулзат</div>

      <div class="ornament-bottom">✦</div>

    </div>
  </div>
</div>

<!-- Уведомление -->
<div class="toast" id="toast"></div>

<script>
  // Применить имя гостя
  function applyGuestName() {
    const name = document.getElementById('guestInput').value.trim();
    if (name) {
      document.getElementById('guestName').innerHTML = 'Урматтуу ' + name + '!';
      showToast('✅ Коноктун аты: ' + name);
    }
  }

  // Сохранить как изображение
  function saveAsImage() {
    const invitation = document.getElementById('invitation');
    const btn = event.target;
    btn.textContent = '⏳ Сакталууда...';
    btn.disabled = true;

    // Убираем рамки редактирования при экспорте
    const guest = document.getElementById('guestName');
    guest.contentEditable = 'false';
    guest.classList.remove('editable');

    html2canvas(invitation, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: null,
      logging: false
    }).then(canvas => {
      const link = document.createElement('a');
      const guestName = document.getElementById('guestInput').value.trim() || 'конок';
      link.download = 'chakyruu_' + guestName + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      showToast('📥 Сүрөт сакталды!');
      btn.textContent = '📥 Сүрөт сактоо';
      btn.disabled = false;

      // Возвращаем редактирование
      guest.contentEditable = 'true';
      guest.classList.add('editable');
    }).catch(err => {
      console.error(err);
      showToast('❌ Ката кетти. Кайра аракет кылыңыз.');
      btn.textContent = '📥 Сүрөт сактоо';
      btn.disabled = false;
      guest.contentEditable = 'true';
      guest.classList.add('editable');
    });
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  document.getElementById('guestInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') applyGuestName();
  });

  // Сохранить как HTML файл
  function saveAsHTML() {
    const clone = document.documentElement.cloneNode(true);
    // Убираем панель управления
    clone.querySelector('.control-panel')?.remove();
    clone.querySelector('.toast')?.remove();
    // Убираем редактирование
    clone.querySelectorAll('[contenteditable]').forEach(el => {
      el.removeAttribute('contenteditable');
    });
    clone.querySelectorAll('.editable').forEach(el => {
      el.classList.remove('editable');
    });
    // Убираем скрипты
    clone.querySelectorAll('script').forEach(s => s.remove());
    // Убираем padding body и центрируем
    const bodyEl = clone.querySelector('body');
    if (bodyEl) bodyEl.style.padding = '0';

    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const guestName = document.getElementById('guestInput').value.trim() || 'конок';
    a.download = 'чакыруу_' + guestName + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('📄 HTML файл жүктөлдү!');
  }
</script>

</body>
</html>
